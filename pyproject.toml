[project]
name = "music-recommender"
version = "0.1.0"
description = "Three-tier music recommendation system: classical CF, neural CF, and theory-aware hybrid"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Johnny Nguyen" }]

dependencies = [
  "numpy>=1.26,<2.2",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "implicit>=0.7.2",
  "torch>=2.2",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "spotipy>=2.23",
  "python-dotenv>=1.0",
  "boto3>=1.34",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
notebook = [
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
]
app = [
  "streamlit>=1.32",
  "plotly>=5.20",
]
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
